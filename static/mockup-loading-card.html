<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Card Mockup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Simulated messages area (blue in your screenshot) */
        .messages-area {
            flex: 1;
            background: rgba(0, 60, 255, 0.1); /* Light blue tint to show the area */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        /* Frosted Glass Loading Card - floating above messages area */
        .loading-card {
            width: 100%;
            max-width: 600px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 48px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated gradient background */
        .loading-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .loading-content {
            position: relative;
            z-index: 1;
        }

        /* Emerald Green Spinner */
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(16, 185, 129, 0.1);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status Text */
        .status-text {
            font-size: 18px;
            font-weight: 600;
            color: #10b981;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .status-subtext {
            font-size: 14px;
            color: rgba(16, 185, 129, 0.6);
            line-height: 1.6;
        }

        /* Progress Dots */
        .progress-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 24px;
        }

        .progress-dot {
            width: 8px;
            height: 8px;
            background: rgba(16, 185, 129, 0.3);
            border-radius: 50%;
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .progress-dot:nth-child(2) { animation-delay: 0.2s; }
        .progress-dot:nth-child(3) { animation-delay: 0.4s; }
        .progress-dot:nth-child(4) { animation-delay: 0.6s; }

        @keyframes dotPulse {
            0%, 100% {
                background: rgba(16, 185, 129, 0.3);
                transform: scale(1);
            }
            50% {
                background: rgba(16, 185, 129, 0.8);
                transform: scale(1.3);
            }
        }

        /* Simulated input area at bottom */
        .input-area {
            background: #0a0a0a;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        /* Demo label */
        .demo-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 60, 255, 0.3);
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Demo controls */
        .controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .controls button {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .controls button:hover {
            background: rgba(16, 185, 129, 0.3);
            border-color: rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body>
    <!-- Messages Area (blue in your screenshot) -->
    <div class="messages-area">
        <div class="demo-label">MESSAGES AREA</div>

        <!-- Frosted Glass Loading Card (floating above) -->
        <div class="loading-card">
            <div class="loading-content">
                <div class="spinner"></div>
                <div class="status-text" id="statusText">Processing Article</div>
                <div class="status-subtext" id="statusSubtext">Converting PDF and extracting images...</div>
                <div class="progress-dots">
                    <div class="progress-dot"></div>
                    <div class="progress-dot"></div>
                    <div class="progress-dot"></div>
                    <div class="progress-dot"></div>
                </div>
            </div>
        </div>

        <!-- Demo controls -->
        <div class="controls">
            <button onclick="setStatus('Uploading', 'Creating article record...')">Upload</button>
            <button onclick="setStatus('Converting PDF', 'Extracting images and charts...')">Convert</button>
            <button onclick="setStatus('Filtering Charts', 'AI is removing ads...')">Filter</button>
            <button onclick="setStatus('Generating Summary', 'AI is analyzing the article...')">Process</button>
        </div>
    </div>

    <!-- Input Area (bottom) -->
    <div class="input-area">
        Input area would be here
    </div>

    <script>
        function setStatus(text, subtext) {
            document.getElementById('statusText').textContent = text;
            document.getElementById('statusSubtext').textContent = subtext;
        }
    </script>
</body>
</html>
